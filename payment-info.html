<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Techers Food payment information</title>
  <style>
    /* Prompt: create payment information with divided shipping and QR codes from the order overview. */
    /* Reason: give every customer a clear, printable SEPA payment request after the combined order is priced. */
    :root { color-scheme: light; --ink: #252525; --muted: #656565; --line: #c7c7c7; --panel: #f3f3f3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e8e8e8; color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 28px auto; padding: 28px; background: #fff; border-radius: 16px; }
    h1 { margin-top: 0; } .muted { color: var(--muted); }
    .settings, .payment { border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin: 18px 0; }
    .settings { display: grid; grid-template-columns: repeat(3, minmax(160px, 1fr)); gap: 14px; background: var(--panel); }
    label { display: grid; gap: 5px; font-weight: 600; } input { width: 100%; padding: 9px; border: 1px solid #999; border-radius: 7px; font: inherit; }
    button, .email { display: inline-block; padding: 10px 14px; border: 1px solid #555; border-radius: 8px; background: #333; color: #fff; font: inherit; cursor: pointer; text-decoration: none; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.secondary, .email { background: #fff; color: #252525; } .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    #summary { font-weight: 700; } .payments { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
    .payment h2 { margin-top: 0; overflow-wrap: anywhere; } .amount { font-size: 26px; font-weight: 800; }
    .qr { width: 180px; height: 180px; margin: 14px 0; } .breakdown { color: var(--muted); }
    .empty { padding: 20px; background: #fff2f2; border-radius: 8px; }
    @media (max-width: 650px) { main { margin: 0; border-radius: 0; padding: 18px; } .settings { grid-template-columns: 1fr; } }
    @media print { body { background: #fff; } main { margin: 0; max-width: none; } .settings, .actions, .email { display: none; } .payment { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    <h1>Payment information</h1>
    <p class="muted">Enter each customer’s item total after the combined restaurant order is complete. Shipping is divided exactly across all customers; any one-cent remainder is allocated to the first customers.</p>
    <section class="settings" aria-label="Payment account and shipping">
      <label>Account holder <input id="holder" autocomplete="organization" placeholder="Techers Food" required></label>
      <label>IBAN <input id="iban" autocomplete="off" placeholder="NL00BANK0123456789" required></label>
      <label>Shipping total (€) <input id="shipping" type="number" min="0" step="0.01" value="0"></label>
    </section>
    <div class="actions"><button id="create" type="button" disabled>Create payment info</button><button class="secondary" id="print" type="button">Print</button></div>
    <p id="summary" aria-live="polite"></p>
    <section id="customers" aria-label="Customer totals"></section>
    <section id="payments" class="payments" aria-label="Customer payment QR codes"></section>
  </main>
  <script src="payment-qr.js"></script>
  <script>
    // Prompt: tally customer totals, divide shipping, and create QR codes plus a payment page.
    // Reason: turn the open-order overview into individual, scannable payment requests without Electron.
    const storedOrders = JSON.parse(localStorage.getItem('techersPaymentOrders') || '[]');
    const byId = id => document.getElementById(id);
    const cents = value => Math.max(0, Math.round(Number(value || 0) * 100));
    const euros = value => (value / 100).toLocaleString('nl-NL', { style: 'currency', currency: 'EUR' });
    const validIban = value => /^[A-Z]{2}[0-9A-Z]{13,32}$/.test(value.replace(/\s/g, '').toUpperCase());
    const paymentPayload = (holder, iban, amount, reference) => ['BCD', '002', '1', 'SCT', '', holder, iban, `EUR${(amount / 100).toFixed(2)}`, '', reference.slice(0, 35)].join('\n');

    function customerRows() {
      const container = byId('customers');
      container.replaceChildren();
      if (!storedOrders.length) { container.innerHTML = '<p class="empty">No orders were passed from the overview. Return to the overview and select Create payment info.</p>'; return; }
      const heading = document.createElement('h2'); heading.textContent = 'Item totals'; container.append(heading);
      storedOrders.forEach((order, index) => {
        const label = document.createElement('label'); label.textContent = order.title;
        const input = document.createElement('input'); input.type = 'number'; input.min = '0'; input.step = '0.01'; input.value = order.itemTotal || '0'; input.dataset.customer = index; input.setAttribute('aria-label', `Item total for ${order.title}`);
        label.append(input); container.append(label);
      });
    }

    // Prompt: require a name and IBAN before QR generation.
    // Reason: prevent incomplete or invalid payment requests from being generated or sent.
    function updateCreateAvailability() {
      const holder = byId('holder').value.trim(); const iban = byId('iban').value.replace(/\s/g, '').toUpperCase();
      const ready = storedOrders.length > 0 && holder.length > 0 && validIban(iban);
      byId('create').disabled = !ready;
      if (!ready) {
        byId('payments').replaceChildren();
        byId('summary').textContent = holder && iban ? 'Enter a valid IBAN to create payment information.' : 'Enter the account holder name and IBAN to enable QR generation.';
      }
    }

    function createPaymentInfo() {
      const holder = byId('holder').value.trim(); const iban = byId('iban').value.replace(/\s/g, '').toUpperCase();
      if (!holder || !validIban(iban)) { byId('summary').textContent = 'Enter an account holder and a valid IBAN first.'; return; }
      const shipping = cents(byId('shipping').value); const count = storedOrders.length;
      const baseShare = count ? Math.floor(shipping / count) : 0; const remainder = count ? shipping % count : 0;
      const inputs = [...byId('customers').querySelectorAll('input[data-customer]')]; const payments = byId('payments'); payments.replaceChildren();
      let itemSum = 0;
      inputs.forEach((input, index) => {
        const itemTotal = cents(input.value); const deliveryShare = baseShare + (index < remainder ? 1 : 0); const total = itemTotal + deliveryShare; itemSum += itemTotal;
        const order = storedOrders[index]; const reference = `Lunch ${order.title}`;
        const card = document.createElement('article'); card.className = 'payment';
        const name = document.createElement('h2'); name.textContent = order.title;
        const amount = document.createElement('p'); amount.className = 'amount'; amount.textContent = euros(total);
        const breakdown = document.createElement('p'); breakdown.className = 'breakdown'; breakdown.textContent = `Items ${euros(itemTotal)} + shipping ${euros(deliveryShare)}`;
        const qr = document.createElement('div'); qr.className = 'qr'; qr.innerHTML = window.TechersQr.svg(paymentPayload(holder, iban, total, reference), { scale: 4 });
        const details = document.createElement('p'); details.textContent = `${holder} · ${iban} · ${reference}`;
        const mail = document.createElement('a'); mail.className = 'email'; mail.textContent = 'Email payment request';
        mail.href = `mailto:${encodeURIComponent(order.title)}?subject=${encodeURIComponent('Techers Food payment request')}&body=${encodeURIComponent(`Please pay ${euros(total)} to ${holder}, IBAN ${iban}. Reference: ${reference}.`)}`;
        card.append(name, amount, breakdown, qr, details, mail); payments.append(card);
      });
      byId('summary').textContent = `Order items: ${euros(itemSum)} · Shipping: ${euros(shipping)} · Total to collect: ${euros(itemSum + shipping)}`;
    }
    customerRows();
    byId('holder').addEventListener('input', updateCreateAvailability);
    byId('iban').addEventListener('input', updateCreateAvailability);
    byId('create').onclick = createPaymentInfo;
    byId('print').onclick = () => window.print();
    updateCreateAvailability();
  </script>
</body>
</html>
